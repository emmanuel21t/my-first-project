<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

     <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Personal Profile</h1>
        <p>Welcome to my webpage</p>
    </header>

    <section class="about">
        <div class="profile-image">
            <img src="images/image.png" alt="My profile picture">
        </div>
        
        <div class="about-text">
            <h2>About Me</h2>

        <p>
            Hello! My name is Omeiza Emmanuel.
            I am learning web development and building my skills in HTML.
        </p>

        <p>
             I enjoy learning new things and creating websites.
        </p>
    </div>
    
    
    </section>

    <section class="contact">
        <h2>Contact Me</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">

            <br><br>

            <label for="message">Message:</label>
            <textarea id="message" placeholder="Enter your message"></textarea>

            <br><br>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 my profile. All rights reserved.</p>
    </footer>

</body>
</html>
